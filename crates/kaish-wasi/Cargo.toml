[package]
name = "kaish-wasi"
description = "kaish as a WASI binary — a pure-function shell for sandboxed text transforms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
# Never published: a wasm binary target with no library consumers. Its kaish
# deps are path-only, so a stray `cargo publish -p kaish-wasi` would fail at
# the registry anyway — this makes the refusal immediate and states the intent.
publish = false

[dependencies]
kaish-kernel = { path = "../kaish-kernel", default-features = false }
kaish-types = { path = "../kaish-types" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util"] }
serde_json = { workspace = true }

[lints]
workspace = true
